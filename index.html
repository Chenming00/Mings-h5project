    <meta name="theme-color" content="#fafaf7" />

    <!--
      Applies the theme before first paint. Without this the class was only set
      inside a React effect, so dark-mode visitors saw a white flash on every
      load. Kept inline and dependency-free on purpose; it also mirrors the
      system preference for first-time visitors.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#191e1b' : '#fafaf7');
        } catch (error) {
          /* Storage can be blocked; the default light theme is still correct. */
        }
      })();
    </script>
