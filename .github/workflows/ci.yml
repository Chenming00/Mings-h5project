name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Headless regressions for the standalone projects: motion-reel's render
      # and audio transports, sbti's timer/countdown behaviour.
      - name: Project regressions
        run: npm run verify

      # audit.cjs detects Chrome at this standard Ubuntu runner path; fail
      # explicitly if it disappears rather than silently skipping the audit.
      - name: Browser smoke
        run: |
          test -x /usr/bin/google-chrome
          npm run smoke
          node tools/smoke/audit.cjs --only stellar-passport,neon-drift --width 844 --height 390
          node tools/smoke/audit.cjs --only stellar-passport,neon-drift --width 320 --height 568

      - name: Build
        run: npm run build
