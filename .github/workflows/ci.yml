name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Headless regressions for the standalone projects: motion-reel's render
      # and audio transports, sbti's timer/countdown behaviour.
      - name: Project regressions
        run: npm run verify

      - name: Build
        run: npm run build
