<!doctype html>
<html lang="zh-CN" data-tags="interactive,generative">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="description" content="用手指搅动一片粒子星云：引力、排斥、漩涡三种力场，按住即反转。">
<title>GRAVITY WELL · 引力沙盒</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#07080b;
    --ink:#eef1f6;
    --muted:#7d8794;
    --line:#20242c;
    --accent:#ff9a5a;
    --x:50%;
    --y:50%;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

  .hud{
    position:fixed;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(16px,3.2vw,34px);
  }
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .brand{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .brand b{display:block;font-size:clamp(18px,3.6vw,26px);letter-spacing:-.4px;color:var(--ink);font-weight:650;margin-top:6px;text-transform:none}
  .hint{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.9;max-width:15em}
  .hint kbd{
    font:inherit;font-size:10px;border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;color:#aab3bf;background:#12151b;
  }

  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .readout{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);letter-spacing:1px}
  .readout b{color:var(--accent);font-weight:600}

  .modes{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
  .modes button{
    appearance:none;cursor:pointer;
    border:1px solid var(--line);background:#0d1015cc;color:#b7c0cc;
    border-radius:999px;padding:9px 17px;font:inherit;font-size:12.5px;
    backdrop-filter:blur(8px);transition:border-color .18s,color .18s,background .18s;
  }
  .modes button:hover{border-color:#3a424e;color:var(--ink)}
  .modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#160a02;font-weight:640}
  .modes button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .modes .ghost{border-style:dashed;color:var(--muted)}

  .glow{
    position:fixed;left:var(--x);top:var(--y);width:340px;height:340px;
    margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,154,90,.13),transparent 68%);
    opacity:0;transition:opacity .35s;
  }
  .glow.on{opacity:1}

  @media(max-width:640px){
    .hint{display:none}
    .bottom{flex-direction:column;align-items:stretch;gap:10px}
    .modes{justify-content:center}
    .modes button{flex:1;padding:11px 10px;text-align:center}
    .readout{text-align:center}
  }
  @media(prefers-reduced-motion:reduce){
    .glow{transition:none}
  }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="粒子引力场画布：移动光标牵引粒子，按住反转力场"></canvas>
<div class="glow" id="glow" aria-hidden="true"></div>

<div class="hud">
  <div class="top">
    <div class="brand">
      Gravity Well
      <b>引力沙盒</b>
    </div>
    <p class="hint">
      移动指针牵引星尘<br>
      按住反转力场 · 点击炸开<br>
      <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 切换 · <kbd>R</kbd> 重置
    </p>
  </div>

  <div class="bottom">
    <div class="readout" id="readout">MODES <b>引力</b> · PARTICLES <b>0</b></div>
    <div class="modes" role="group" aria-label="力场模式">
      <button data-mode="0" aria-pressed="true">引力</button>
      <button data-mode="1" aria-pressed="false">排斥</button>
      <button data-mode="2" aria-pressed="false">漩涡</button>
      <button class="ghost" id="reset">重置</button>
    </div>
  </div>
</div>

<script>
'use strict';
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', { alpha: false });
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var glow = document.getElementById('glow');
  var readout = document.getElementById('readout');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LABELS = ['引力', '排斥', '漩涡'];

  // Amber -> rose -> violet -> cyan, indexed by distance from the attractor.
  // 32 precomputed strings so the render loop never builds colours per frame.
  var STOPS = [[255, 154, 90], [255, 92, 122], [156, 108, 255], [90, 210, 244]];
  var PALETTE = (function () {
    var out = [];
    for (var i = 0; i < 32; i++) {
      var t = (i / 31) * (STOPS.length - 1);
      var a = STOPS[Math.floor(t)];
      var b = STOPS[Math.min(STOPS.length - 1, Math.ceil(t))];
      var k = t - Math.floor(t);
      out.push(
        'rgb(' +
        Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
        Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
        Math.round(a[2] + (b[2] - a[2]) * k) + ')'
      );
    }
    return out;
  })();

  var W = 0, H = 0, DPR = 1;
  var particles = [];
  var mode = 0;
  var holding = false;
  var running = true;
  var lastTime = 0;

  var pointer = { x: 0, y: 0, tx: 0, ty: 0, active: false };

  var G = 1.5e7;      // gravitational constant in px^3/s^2
  var SOFT = 90000;   // softening: keeps the centre from becoming a singularity

  function particleCount() {
    var area = W * H;
    var base = Math.round(area / 1500);
    base = Math.max(360, Math.min(reduceMotion ? 420 : 1500, base));
    return base;
  }

  function makeParticle(spread) {
    var angle = Math.random() * Math.PI * 2;
    var radius = (0.06 + Math.random() * (spread ? 0.36 : 0.18)) * Math.min(W, H);
    var x = W / 2 + Math.cos(angle) * radius;
    var y = H / 2 + Math.sin(angle) * radius;
    // Tangential speed that roughly balances gravity at this radius, so the
    // cloud starts in orbit instead of collapsing into a dot.
    var accel = G / (radius * radius + SOFT);
    var speed = Math.sqrt(accel * radius) * (0.82 + Math.random() * 0.36);
    return {
      x: x,
      y: y,
      px: x,
      py: y,
      vx: -Math.sin(angle) * speed,
      vy: Math.cos(angle) * speed,
      size: 0.7 + Math.random() * 1.5,
      hue: 0
    };
  }

  function seed() {
    var n = particleCount();
    particles = new Array(n);
    for (var i = 0; i < n; i++) {
      var p = makeParticle(true);
      p.px = p.x; p.py = p.y;
      particles[i] = p;
    }
    updateReadout();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#07080b';
    ctx.fillRect(0, 0, W, H);
    if (!pointer.active) {
      pointer.x = W / 2;
      pointer.y = H / 2;
      // tx/ty must follow, otherwise the frame loop lerps the attractor towards
      // the origin and the whole field slides into the top-left corner.
      pointer.tx = W / 2;
      pointer.ty = H / 2;
    }
    seed();
  }

  function updateReadout() {
    readout.innerHTML = 'MODES <b>' + LABELS[mode] + '</b> · PARTICLES <b>' + particles.length + '</b>';
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (btn) {
      btn.setAttribute('aria-pressed', String(Number(btn.dataset.mode) === next));
    });
    updateReadout();
  }

  // One-shot radial impulse: the "throw" that makes clicks feel physical.
  function burst(x, y, strength) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = p.x - x;
      var dy = p.y - y;
      var d = Math.sqrt(dx * dx + dy * dy) + 8;
      var f = strength / (d * 0.55);
      p.vx += (dx / d) * f;
      p.vy += (dy / d) * f;
    }
  }

  function step(dt) {
    var px = pointer.x;
    var py = pointer.y;
    var invert = holding;

    // Additive blending turns overlapping orbits into soft nebula hotspots.
    ctx.globalCompositeOperation = 'lighter';

    // Soft core glow so the well reads as a light source, not a hole.
    var core = ctx.createRadialGradient(px, py, 0, px, py, 160);
    core.addColorStop(0, 'rgba(255,190,140,0.11)');
    core.addColorStop(0.45, 'rgba(150,110,255,0.055)');
    core.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = core;
    ctx.fillRect(px - 160, py - 160, 320, 320);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = px - p.x;
      var dy = py - p.y;
      var d2 = dx * dx + dy * dy + SOFT;
      var d = Math.sqrt(d2);
      var f = G / d2;
      var ux = dx / d;
      var uy = dy / d;
      var ax = 0, ay = 0;

      if (mode === 2) {
        ax = -uy * f * 1.2 + ux * f * 0.16;
        ay = ux * f * 1.2 + uy * f * 0.16;
      } else {
        var sign = mode === 0 ? 1 : -1;
        if (invert) sign = -sign;
        ax = ux * f * sign;
        ay = uy * f * sign;
      }

      p.vx += ax * dt;
      p.vy += ay * dt;

      // Very light drag: orbits stay legible for a long time without the cloud
      // slowly freezing into a single point.
      var damp = Math.pow(0.9992, dt * 60);
      p.vx *= damp;
      p.vy *= damp;

      var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      var cap = 2600;
      if (speed > cap) {
        p.vx = (p.vx / speed) * cap;
        p.vy = (p.vy / speed) * cap;
        speed = cap;
      }

      p.px = p.x;
      p.py = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx) * 0.72; }
      else if (p.x > W) { p.x = W; p.vx = -Math.abs(p.vx) * 0.72; }
      if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy) * 0.72; }
      else if (p.y > H) { p.y = H; p.vy = -Math.abs(p.vy) * 0.72; }

      // Colour by orbit radius: tight orbits burn amber, wide ones cool to cyan.
      var norm = Math.min(1, Math.sqrt(dx * dx + dy * dy) / (Math.min(W, H) * 0.62));
      var palette = PALETTE[(norm * 31) | 0];

      // A round-capped segment per frame is what makes the trails continuous;
      // dots alone leave visible gaps at orbital speed.
      ctx.strokeStyle = palette;
      ctx.globalAlpha = 0.42 + Math.min(0.5, speed / 1500);
      ctx.lineWidth = p.size * 1.35;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    if (!running) return;
    var dt = lastTime ? Math.min(0.034, (now - lastTime) / 1000) : 0.016;
    lastTime = now;

    // Motion blur instead of a hard clear: this is what creates the trails.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(7,8,11,0.055)';
    ctx.fillRect(0, 0, W, H);

    pointer.x += (pointer.tx - pointer.x) * 0.35;
    pointer.y += (pointer.ty - pointer.y) * 0.35;

    step(dt);
    requestAnimationFrame(frame);
  }

  function placePointer(x, y) {
    pointer.tx = x;
    pointer.ty = y;
    pointer.active = true;
    glow.classList.add('on');
    glow.style.setProperty('--x', x + 'px');
    glow.style.setProperty('--y', y + 'px');
  }

  canvas.addEventListener('pointermove', function (event) {
    placePointer(event.clientX, event.clientY);
  });

  canvas.addEventListener('pointerdown', function (event) {
    placePointer(event.clientX, event.clientY);
    holding = true;
    burst(event.clientX, event.clientY, 9000);
    canvas.setPointerCapture(event.pointerId);
  });

  window.addEventListener('pointerup', function () { holding = false; });
  window.addEventListener('pointercancel', function () { holding = false; });
  canvas.addEventListener('pointerleave', function () {
    pointer.active = false;
    glow.classList.remove('on');
  });

  canvas.addEventListener('dblclick', function (event) {
    burst(event.clientX, event.clientY, 24000);
  });

  window.addEventListener('keydown', function (event) {
    if (event.key === '1') setMode(0);
    if (event.key === '2') setMode(1);
    if (event.key === '3') setMode(2);
    if (event.key === 'r' || event.key === 'R') seed();
  });

  document.querySelectorAll('[data-mode]').forEach(function (btn) {
    btn.addEventListener('click', function () { setMode(Number(btn.dataset.mode)); });
  });
  document.getElementById('reset').addEventListener('click', seed);

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    lastTime = 0;
    if (running) requestAnimationFrame(frame);
  });

  window.addEventListener('resize', resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
