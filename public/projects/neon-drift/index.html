<!doctype html>
<html lang="zh-CN" data-tags="interactive,animation,audio">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090819">
<title>NEON DRIFT · 午夜电台</title>
<style>
:root{color-scheme:dark;--pink:#ff61c8;--cyan:#69f4ef;--purple:#a68cff}*{box-sizing:border-box}body{margin:0;background:#080818;color:#f7f5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit}main{position:relative;overflow:hidden;min-height:100svh;padding:clamp(24px,5vw,56px);background:radial-gradient(ellipse at 50% 56%,#432465 0%,#171330 36%,#080818 76%)}main:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:47px 47px}header,.content,footer{position:relative;z-index:2;max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.2em;font-weight:800}header span:last-child{color:var(--cyan)}.content{display:grid;grid-template-columns:1fr 1.1fr;align-items:center;min-height:calc(100svh - 160px);gap:20px}.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--cyan);font-weight:800}.eyebrow:before{content:"●";margin-right:10px;color:var(--pink)}h1{font-size:clamp(64px,10vw,140px);line-height:.79;letter-spacing:-.08em;margin:32px 0;font-weight:900}h1 em{display:block;font-style:normal;color:transparent;-webkit-text-stroke:1px #fff;text-shadow:0 0 35px #b576ff66}.desc{color:#c4bbd7;font-size:15px;line-height:1.9;max-width:360px}.controls{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #ffffff40;background:#ffffff0a;color:white;padding:14px 20px;border-radius:3px;font-size:12px;font-weight:800;letter-spacing:.08em;transition:.2s}button:hover,button:focus-visible{border-color:var(--cyan);box-shadow:0 0 20px #69f4ef33;outline:none}.play{background:var(--cyan);color:#090819;border-color:var(--cyan)}.hint{margin-top:17px;font-size:11px;color:#aaa1bd;line-height:1.7}.scene{height:min(65vw,560px);min-height:330px;position:relative;display:grid;place-items:center;perspective:400px}.sun{width:55%;aspect-ratio:1;border-radius:50%;background:linear-gradient(#ffdfac 0%,#fc74b4 48%,#aa4ffa 100%);box-shadow:0 0 80px #f655b880;position:absolute;top:8%;mask-image:linear-gradient(to bottom,#000 0 60%,transparent 60% 62%,#000 62% 68%,transparent 68% 71%,#000 71% 77%,transparent 77% 81%,#000 81% 87%,transparent 87% 92%,#000 92%)}.horizon{position:absolute;inset:52% -20% -10%;overflow:hidden;border-top:1px solid #ff79db;background:linear-gradient(#1d1030,#090919)}.grid{position:absolute;inset:-80% -100%;transform:rotateX(68deg);background-image:linear-gradient(#d051bf77 1px,transparent 1px),linear-gradient(90deg,#d051bf77 1px,transparent 1px);background-size:55px 55px;animation:drive 2s linear infinite;animation-play-state:paused}.playing .grid{animation-play-state:running}@keyframes drive{to{background-position:0 55px}}.orb{z-index:1;width:34%;aspect-ratio:1;border:1px solid #ffffff77;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 45px #c67eff77,inset 0 0 30px #ffb4f955;background:#130d24aa;backdrop-filter:blur(8px)}.orb:before,.orb:after{content:"";position:absolute;width:42%;aspect-ratio:1;border:1px solid #ffffff40;border-radius:50%;animation:spin 12s linear infinite}.orb:after{width:49%;border-style:dashed;animation-direction:reverse}.orb span{font-size:clamp(32px,5vw,60px);color:var(--cyan);text-shadow:0 0 20px var(--cyan)}@keyframes spin{to{transform:rotate(360deg)}}footer{display:flex;justify-content:space-between;border-top:1px solid #ffffff22;padding-top:20px;color:#a59bb9;font-size:10px;letter-spacing:.14em}footer strong{color:var(--pink)}@media(max-width:700px){main{padding:24px 24px max(24px,env(safe-area-inset-bottom))}.content{grid-template-columns:1fr;gap:0;min-height:0}.copy{padding-top:64px;order:1}h1{font-size:clamp(64px,18vw,105px);margin:25px 0}.scene{order:2;height:86vw;min-height:280px;max-height:440px;margin:5px -24px 20px}footer{gap:15px}.desc{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body><main id="app"><header><span>✳ &nbsp; NEON DRIFT</span><span>● &nbsp; ON AIR / 24:00</span></header><div class="content"><section class="copy"><div class="eyebrow">YOUR MIDNIGHT ESCAPE</div><h1>NEON <em>DRIFT.</em></h1><p class="desc">驶入城市的另一面。让霓虹掠过窗边，把今天留在身后。戴上耳机，进入属于你的午夜频率。</p><div class="controls"><button class="play" id="play" type="button" aria-pressed="false">▶ &nbsp; 开启电台</button><button id="mood" type="button">✳ &nbsp; 切换频率</button></div><p class="hint" id="status" role="status">点击开启，生成一段低音量的合成器节奏。<br>声音由浏览器实时合成，无需外部音频。</p></section><div class="scene" aria-hidden="true"><div class="sun"></div><div class="horizon"><div class="grid"></div></div><div class="orb"><span>✳</span></div></div></div><footer><span>NO DESTINATION. JUST THE FEELING.</span><strong id="frequency">FM 88.8 / DREAM</strong></footer></main>
<script>
(()=>{const app=document.getElementById('app'),play=document.getElementById('play'),mood=document.getElementById('mood'),status=document.getElementById('status'),frequency=document.getElementById('frequency');const modes=[{name:'FM 88.8 / DREAM',notes:[110,164.81,220,246.94],tempo:440},{name:'FM 92.6 / AFTERGLOW',notes:[130.81,196,261.63,293.66],tempo:360},{name:'FM 105.4 / HORIZON',notes:[98,146.83,196,220],tempo:520}];let mode=0,ctx=null,timer=null,step=0;function note(){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=modes[mode].notes[step++%4];gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.055,t+.04);gain.gain.exponentialRampToValueAtTime(.0001,t+.36);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.38)}function schedule(){clearInterval(timer);note();timer=setInterval(note,modes[mode].tempo)}play.addEventListener('click',async()=>{if(timer){clearInterval(timer);timer=null;app.classList.remove('playing');play.setAttribute('aria-pressed','false');play.textContent='▶ 继续电台';status.textContent='电台已暂停，点击继续你的旅程。';return}try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('unsupported');ctx=ctx||new Audio();await ctx.resume();schedule();app.classList.add('playing');play.setAttribute('aria-pressed','true');play.textContent='Ⅱ 暂停电台';status.textContent='正在播放合成器节奏，切换频率探索另一种心情。'}catch{status.textContent='当前浏览器无法播放音频，请尝试其他浏览器。'}});mood.addEventListener('click',()=>{mode=(mode+1)%modes.length;frequency.textContent=modes[mode].name;if(timer)schedule();status.textContent='已切换至 '+modes[mode].name+(timer?'，享受旅程。':'，点击开启电台。')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer){clearInterval(timer);timer=null;app.classList.remove('playing');play.setAttribute('aria-pressed','false');play.textContent='▶ 继续电台';status.textContent='电台已暂停，点击继续你的旅程。'}})})();
</script></body></html>
