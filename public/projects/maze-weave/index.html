<!doctype html>
<html lang="zh-CN" data-tags="generative,animation">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<meta name="description" content="用递归回溯算法实时开凿迷宫，再用广度优先搜索把解法走给你看。">
<title>MAZE WEAVE · 迷宫编织</title>
<style>
  :root{
    color-scheme:light;
    --paper:#f6f4ee;
    --ink:#23262b;
    --muted:#8b8780;
    --line:#ddd8cf;
    --accent:#c9503a;
    --panel:#fffdf8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;background:var(--paper);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:760px;padding:clamp(20px,4.5vw,44px) clamp(16px,4vw,28px) 30px;flex:1;display:flex;flex-direction:column}

  header{margin-bottom:clamp(16px,3vw,26px)}
  .eyebrow{font-size:10px;letter-spacing:3.2px;text-transform:uppercase;color:var(--muted);margin:0}
  h1{margin:8px 0 0;font-size:clamp(25px,5vw,38px);line-height:1.15;letter-spacing:-1px;font-weight:700}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{margin:10px 0 0;color:#6f6b64;font-size:13px;max-width:34em}

  .stage{
    position:relative;flex:1;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:clamp(10px,2.4vw,18px);min-height:min(58vh,460px);
    box-shadow:0 1px 0 #fff inset,0 12px 30px -22px #23262b66;
  }
  canvas{display:block;max-width:100%;height:auto;border-radius:4px}

  .stats{
    display:flex;gap:clamp(14px,4vw,34px);flex-wrap:wrap;
    margin-top:14px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .stats b{color:var(--ink);font-weight:650}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  button{
    appearance:none;cursor:pointer;font:inherit;font-size:12.5px;
    border:1px solid var(--line);background:var(--panel);color:#4a4741;
    border-radius:9px;padding:10px 16px;transition:border-color .15s,color .15s,background .15s,transform .08s;
  }
  button:hover{border-color:#c3bdb2;color:var(--ink)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  button.primary{background:var(--ink);border-color:var(--ink);color:#f8f6f1;font-weight:600}
  button.primary:hover{background:#33373d;border-color:#33373d}
  button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .sizes{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .sizes button{border:0;border-radius:0;padding:10px 13px;font-size:12px;color:var(--muted)}
  .sizes button + button{border-left:1px solid var(--line)}
  .sizes button[aria-pressed="true"]{background:var(--ink);color:#f8f6f1}

  footer{margin-top:auto;padding-top:20px;font-size:11px;color:#a29d94;line-height:1.9}
  footer kbd{font:inherit;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#7d786f}

  @media(max-width:520px){
    .stage{min-height:min(52vh,380px)}
    .toolbar{gap:6px}
    button{padding:10px 13px}
  }
  @media(prefers-reduced-motion:reduce){
    button{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Recursive Backtracker / BFS</p>
    <h1>迷宫<em>编织</em></h1>
    <p class="lede">每一格墙都是一次随机选择的结果。开凿完成后，广度优先搜索会找出唯一通路。</p>
  </header>

  <div class="stage">
    <canvas id="maze" role="img" aria-label="随机生成的迷宫，虚线为入口到出口的解法路径"></canvas>
  </div>

  <div class="stats">
    <span>尺寸 <b id="statSize">20 × 20</b></span>
    <span>开凿 <b id="statSteps">0</b> 步</span>
    <span>路径 <b id="statPath">—</b></span>
    <span>用时 <b id="statTime">0.0s</b></span>
  </div>

  <div class="toolbar">
    <button class="primary" id="regen">重新生成</button>
    <button id="solve" aria-pressed="false">显示解法</button>
    <div class="sizes" role="group" aria-label="迷宫尺寸">
      <button data-size="12" aria-pressed="false">12</button>
      <button data-size="20" aria-pressed="true">20</button>
      <button data-size="32" aria-pressed="false">32</button>
    </div>
    <button id="save">保存图片</button>
  </div>

  <footer>
    <kbd>空格</kbd> 重新生成 · <kbd>S</kbd> 切换解法
  </footer>
</div>

<script>
'use strict';
(function () {
  var canvas = document.getElementById('maze');
  var ctx = canvas.getContext('2d');
  var statSize = document.getElementById('statSize');
  var statSteps = document.getElementById('statSteps');
  var statPath = document.getElementById('statPath');
  var statTime = document.getElementById('statTime');
  var solveBtn = document.getElementById('solve');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PAPER = '#fffdf8';
  var INK = '#23262b';
  var ACCENT = '#c9503a';
  var TRACE = '#e2ded6';

  var N = 20;
  var size = 0;
  var grid = [];
  var stack = [];
  var carveState = null;
  var solution = null;
  var showSolution = false;
  var revealPath = 0;
  var finished = false;
  var steps = 0;
  var startedAt = 0;
  var elapsed = 0;
  var dpr = 1;

  function idx(x, y) { return y * N + x; }

  function reset() {
    grid = new Array(N * N);
    for (var i = 0; i < N * N; i++) {
      grid[i] = { walls: [1, 1, 1, 1], visited: false, seen: false };
    }
    stack = [idx(0, 0)];
    grid[idx(0, 0)].visited = true;
    grid[idx(0, 0)].seen = true;
    carveState = { done: false };
    solution = null;
    showSolution = false;
    revealPath = 0;
    finished = false;
    steps = 0;
    elapsed = 0;
    startedAt = performance.now();
    solveBtn.setAttribute('aria-pressed', 'false');
    solveBtn.textContent = '显示解法';
    statPath.textContent = '—';
    statSteps.textContent = '0';
    statSize.textContent = N + ' × ' + N;
    statTime.textContent = '0.0s';
    resize();
  }

  function resize() {
    var box = canvas.parentElement.getBoundingClientRect();
    var available = Math.min(box.width - 40, 560);
    var side = Math.max(240, Math.min(available, window.innerHeight * 0.6));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = Math.floor(side / N) * N;
    if (!size) size = Math.floor(side);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function neighbours(x, y) {
    var out = [];
    if (y > 0) out.push([x, y - 1, 0, 2]);
    if (x < N - 1) out.push([x + 1, y, 1, 3]);
    if (y < N - 1) out.push([x, y + 1, 2, 0]);
    if (x > 0) out.push([x - 1, y, 3, 1]);
    return out;
  }

  // One DFS step per call; the caller decides how many per frame.
  function carveStep() {
    if (!stack.length) { carveState.done = true; return; }
    var current = stack[stack.length - 1];
    var cx = current % N;
    var cy = (current - cx) / N;

    var options = neighbours(cx, cy).filter(function (option) {
      return !grid[idx(option[0], option[1])].visited;
    });

    if (!options.length) { stack.pop(); return; }

    var pick = options[(Math.random() * options.length) | 0];
    var nextX = pick[0];
    var nextY = pick[1];
    grid[current].walls[pick[2]] = 0;
    grid[idx(nextX, nextY)].walls[pick[3]] = 0;
    grid[idx(nextX, nextY)].visited = true;
    grid[idx(nextX, nextY)].seen = true;
    stack.push(idx(nextX, nextY));
    steps++;
  }

  function solve() {
    var start = idx(0, 0);
    var goal = idx(N - 1, N - 1);
    var prev = new Int32Array(N * N).fill(-1);
    var queue = [start];
    var visited = new Uint8Array(N * N);
    visited[start] = 1;

    while (queue.length) {
      var node = queue.shift();
      if (node === goal) break;
      var x = node % N;
      var y = (node - x) / N;
      var walls = grid[node].walls;
      for (var dir = 0; dir < 4; dir++) {
        if (walls[dir]) continue;
        var nx = x + (dir === 1 ? 1 : dir === 3 ? -1 : 0);
        var ny = y + (dir === 2 ? 1 : dir === 0 ? -1 : 0);
        var next = idx(nx, ny);
        if (visited[next]) continue;
        visited[next] = 1;
        prev[next] = node;
        queue.push(next);
      }
    }

    var path = [];
    var cursor = goal;
    while (cursor !== -1) {
      path.push(cursor);
      if (cursor === start) break;
      cursor = prev[cursor];
    }
    return path.reverse();
  }

  function draw() {
    var cell = size / N;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, size, size);

    // Faint trace of visited cells keeps the growth visible while carving.
    if (!finished) {
      ctx.fillStyle = TRACE;
      for (var i = 0; i < grid.length; i++) {
        if (!grid[i].seen) continue;
        var tx = (i % N) * cell;
        var ty = ((i - (i % N)) / N) * cell;
        ctx.fillRect(tx, ty, cell, cell);
      }
    }

    if (solution && showSolution) {
      var count = Math.min(solution.length, revealPath);
      if (count > 1) {
        ctx.strokeStyle = ACCENT;
        ctx.lineWidth = Math.max(2, cell * 0.26);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for (var s = 0; s < count; s++) {
          var node = solution[s];
          var sx = ((node % N) + 0.5) * cell;
          var sy = (((node - (node % N)) / N) + 0.5) * cell;
          if (s === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }
    }

    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1, Math.min(2.4, cell * 0.12));
    ctx.lineCap = 'butt';
    ctx.beginPath();
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var c = grid[idx(x, y)];
        var px = x * cell;
        var py = y * cell;
        if (c.walls[0]) { ctx.moveTo(px, py); ctx.lineTo(px + cell, py); }
        if (c.walls[3]) { ctx.moveTo(px, py); ctx.lineTo(px, py + cell); }
        if (y === N - 1 && c.walls[2]) { ctx.moveTo(px, py + cell); ctx.lineTo(px + cell, py + cell); }
        if (x === N - 1 && c.walls[1]) { ctx.moveTo(px + cell, py); ctx.lineTo(px + cell, py + cell); }
      }
    }
    ctx.stroke();

    // Entry and exit marks.
    var dot = Math.max(2.2, cell * 0.2);
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.arc(cell * 0.5, cell * 0.5, dot, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(size - cell * 0.5, size - cell * 0.5, dot, 0, Math.PI * 2);
    ctx.fill();
  }

  function startSolution() {
    if (!solution) solution = solve();
    showSolution = true;
    revealPath = reduceMotion ? solution.length : 1;
    solveBtn.setAttribute('aria-pressed', 'true');
    solveBtn.textContent = '隐藏解法';
    statPath.textContent = solution.length + ' 格';
    draw();
    // The carving loop has already stopped, so the reveal needs its own frames.
    lastFrame = 0;
    requestAnimationFrame(loop);
  }

  function hideSolution() {
    showSolution = false;
    revealPath = 0;
    solveBtn.setAttribute('aria-pressed', 'false');
    solveBtn.textContent = '显示解法';
    draw();
  }

  var lastFrame = 0;

  function loop(now) {
    if (!lastFrame) lastFrame = now;
    var dt = now - lastFrame;
    lastFrame = now;

    if (!carveState.done) {
      // Bigger grids carve more cells per frame so the animation stays around
      // the same duration instead of dragging on.
      var scale = (N * N) / 400;
      var budget = reduceMotion ? N * N : Math.max(1, Math.round((dt / 6) * scale));
      for (var i = 0; i < budget && !carveState.done; i++) carveStep();
      elapsed = (now - startedAt) / 1000;
      statSteps.textContent = String(steps);
      statTime.textContent = elapsed.toFixed(1) + 's';
      draw();
      if (carveState.done) {
        finished = true;
        setTimeout(function () { startSolution(); }, reduceMotion ? 0 : 260);
      }
      requestAnimationFrame(loop);
      return;
    }

    if (showSolution && solution && revealPath < solution.length) {
      revealPath = Math.min(solution.length, revealPath + Math.max(1, Math.round(dt / 14)));
      draw();
      requestAnimationFrame(loop);
      return;
    }

    draw();
  }

  function regenerate() {
    reset();
    lastFrame = 0;
    requestAnimationFrame(loop);
  }

  document.getElementById('regen').addEventListener('click', regenerate);
  solveBtn.addEventListener('click', function () {
    if (!carveState.done) return;
    showSolution ? hideSolution() : startSolution();
  });

  document.querySelectorAll('[data-size]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      N = Number(btn.dataset.size);
      document.querySelectorAll('[data-size]').forEach(function (other) {
        other.setAttribute('aria-pressed', String(other === btn));
      });
      regenerate();
    });
  });

  document.getElementById('save').addEventListener('click', function () {
    var link = document.createElement('a');
    link.download = 'maze-' + N + 'x' + N + '.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
  });

  window.addEventListener('keydown', function (event) {
    var onButton = Boolean(event.target.closest && event.target.closest('button'));
    if (event.code === 'Space' && !onButton) { event.preventDefault(); regenerate(); }
    if (event.key === 's' || event.key === 'S') {
      if (!carveState.done) return;
      showSolution ? hideSolution() : startSolution();
    }
  });

  var resizeTimer = null;
  function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  }
  window.addEventListener('resize', scheduleResize);

  // The first measurement can happen before the flex layout settles, which
  // would leave the maze smaller than its frame. Re-fit whenever the frame
  // itself changes size.
  if (window.ResizeObserver) {
    var stage = canvas.parentElement;
    new ResizeObserver(scheduleResize).observe(stage);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
